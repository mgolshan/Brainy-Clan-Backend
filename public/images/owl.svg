<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Brainy Clan mascot "Ollie" — a round, friendly owl (original geometric mark).
    Source of truth for every app icon / splash / favicon PNG: run `npm run brand:render`.
    The <g id="owl"> group is reused by scripts/render-brand.mjs; the silhouette group is used for
    the Android monochrome (themed) icon. Colours: owl orange #FF8A3D, wing/disc #E8742A,
    belly cream #FFE9C9, beak/feet yellow #FFC83D, eyes navy #1B2A4A, brand blue #1D6FD8.
  -->
  <g id="owl">
    <!-- wings (behind the body) -->
    <ellipse cx="282" cy="610" rx="58" ry="132" transform="rotate(16 282 610)" fill="#E8742A"/>
    <ellipse cx="742" cy="610" rx="58" ry="132" transform="rotate(-16 742 610)" fill="#E8742A"/>
    <!-- feet -->
    <ellipse cx="450" cy="842" rx="44" ry="20" fill="#FFC83D"/>
    <ellipse cx="574" cy="842" rx="44" ry="20" fill="#FFC83D"/>
    <!-- ear tufts -->
    <path d="M300 390 L292 206 L438 292 Z" fill="#FF8A3D" stroke="#FF8A3D" stroke-width="44" stroke-linejoin="round"/>
    <path d="M724 390 L732 206 L586 292 Z" fill="#FF8A3D" stroke="#FF8A3D" stroke-width="44" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="512" cy="546" rx="268" ry="296" fill="#FF8A3D"/>
    <!-- belly with three little feathers -->
    <ellipse cx="512" cy="672" rx="166" ry="150" fill="#FFE9C9"/>
    <path d="M448 650 q22 24 44 0 M532 650 q22 24 44 0 M490 712 q22 24 44 0" fill="none" stroke="#F2A15F" stroke-width="14" stroke-linecap="round"/>
    <!-- facial discs -->
    <circle cx="418" cy="452" r="118" fill="#E8742A"/>
    <circle cx="606" cy="452" r="118" fill="#E8742A"/>
    <!-- eyes -->
    <circle cx="418" cy="452" r="94" fill="#FFFFFF"/>
    <circle cx="606" cy="452" r="94" fill="#FFFFFF"/>
    <circle cx="434" cy="464" r="50" fill="#1B2A4A"/>
    <circle cx="590" cy="464" r="50" fill="#1B2A4A"/>
    <circle cx="452" cy="442" r="17" fill="#FFFFFF"/>
    <circle cx="608" cy="442" r="17" fill="#FFFFFF"/>
    <!-- beak -->
    <path d="M486 548 L538 548 L512 594 Z" fill="#FFC83D" stroke="#FFC83D" stroke-width="18" stroke-linejoin="round"/>
  </g>
  <!-- One-colour silhouette (Android themed icon): owl shape with eyes and beak cut out. -->
  <defs>
    <mask id="owl-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="418" cy="452" r="94" fill="#000000"/>
      <circle cx="606" cy="452" r="94" fill="#000000"/>
      <circle cx="434" cy="464" r="50" fill="#FFFFFF"/>
      <circle cx="590" cy="464" r="50" fill="#FFFFFF"/>
      <path d="M486 548 L538 548 L512 594 Z" fill="#000000" stroke="#000000" stroke-width="18" stroke-linejoin="round"/>
      <path d="M448 650 q22 24 44 0 M532 650 q22 24 44 0 M490 712 q22 24 44 0" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
    </mask>
  </defs>
  <g id="owl-silhouette" display="none">
    <g mask="url(#owl-cutouts)" fill="#FFFFFF">
      <ellipse cx="282" cy="610" rx="58" ry="132" transform="rotate(16 282 610)"/>
      <ellipse cx="742" cy="610" rx="58" ry="132" transform="rotate(-16 742 610)"/>
      <ellipse cx="450" cy="842" rx="44" ry="20"/>
      <ellipse cx="574" cy="842" rx="44" ry="20"/>
      <path d="M300 390 L292 206 L438 292 Z" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round"/>
      <path d="M724 390 L732 206 L586 292 Z" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round"/>
      <ellipse cx="512" cy="546" rx="268" ry="296"/>
    </g>
  </g>
</svg>
