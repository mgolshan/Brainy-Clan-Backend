; Brainy Clan backend - PHP-FPM overrides for PRODUCTION (loaded last from php-fpm.d/).
; Runs as the unprivileged "brainy" user. Request logging is Caddy's job; PHP errors go to the
; container log via Laravel (LOG_CHANNEL=stderr).

[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
access.log = /dev/null
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
; CX22 (4 GB RAM): ~60 MB per worker.
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
