; Brainy Clan backend - PHP settings for local development.
; Copied into the image as conf.d/zz-brainy-clan.ini (rebuild after changes:
; docker compose build app).

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50

expose_php = Off
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

date.timezone = UTC

; OPcache is built into PHP 8.5. Timestamp checks come from the environment
; (docker-compose.yml): by default files are re-checked at most every 2 seconds, so edits
; show up almost immediately. Each check is a stat() over the Windows bind mount, which is
; what makes requests slow there; PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 turns checks off
; (restart php-fpm after code changes). The ${VAR:-default} syntax needs PHP >= 8.3.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE_FREQ:-2}
; Compiled scripts are also written to the container's own (fast) filesystem, so a
; `docker compose restart app` does not have to recompile everything over the bind mount.
opcache.file_cache = /tmp/opcache
opcache.file_cache_consistency_checks = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000

; A larger realpath cache avoids repeated filesystem lookups, which are expensive on
; Windows bind mounts.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
