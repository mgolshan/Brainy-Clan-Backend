; Brainy Clan backend - PHP settings for local development.
; Copied into the image as conf.d/zz-brainy-clan.ini (rebuild after changes:
; docker compose build app).

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50

expose_php = Off
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

date.timezone = UTC

; OPcache is built into PHP 8.5. Keep it on, but re-check file timestamps on every
; request so code edits are picked up immediately.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000

; A larger realpath cache avoids repeated filesystem lookups, which are expensive on
; Windows bind mounts.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
