; Brainy Clan backend - PHP-FPM overrides (loaded last from php-fpm.d/).
;
; The container runs as the unprivileged "brainy" user. The official image logs to
; /proc/self/fd/2, which a non-root process cannot always re-open (the stdio pipes
; belong to root), and php-fpm refuses to start when it cannot open its logs. So the
; FPM master log goes to a file inside the container and request logging is left to
; nginx. Laravel's own log is in storage/logs/laravel.log as usual.
;   View it with: docker compose exec app tail -f /tmp/php-fpm.log

[global]
error_log = /tmp/php-fpm.log

[www]
access.log = /dev/null
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
